# ──────────────────────────────────────────────────────────────────────
# iran-market-price-bot — تنظیمات Cloudflare Worker
#
# KV namespace STATE در مرحله ۲ ساخته شد و id واقعی آن زیر ثبت شده است.
# Secretها فقط با `wrangler secret put NAME` (هرگز در این فایل):
#      TELEGRAM_BOT_TOKEN, TELEGRAM_WEBHOOK_SECRET, ADMIN_USER_ID,
#      CHANNEL_ID, PRICE_API_KEY (در صورت نیاز provider)
# ──────────────────────────────────────────────────────────────────────

name = "iran-market-price-bot"
main = "src/index.ts"
compatibility_date = "2025-09-15"

# --- Vars (غیر حساس — public) ---
# منبع قیمت واقعی: نرخ‌سنج جهان‌خواهن (GET بدون احراز هویت، JSON کوچک).
# تغییر منبع فقط همین‌جا؛ fail-closed در registry (بدون fallback).
[vars]
PRICE_PROVIDER = "jahankhahan"
PRICE_API_BASE_URL = "https://nerkh.jahankhahan.shop/data/live.json"

# --- اعتبارسنجی متقاطع (بند ۳ مأموریت ۲۰۲۶-۱۰-۱۱) ---
# مقایسهٔ منبع اصلی با مرجع قبل از انتشار مقدار «تغییرکرده».
# مرجعها: TGJU (call1.tgju.org/ajax.json — عمومی/رایگان) برای ارز/طلا/سکه،
# Wallex (depth USDTTMN — دفتر سفارش صرافی، مستقل) برای تتر.
# مرجع در دسترس نباشد → چک advisory (انتشار ادامه؛ لاگ ثبت میشود).
# اختلاف بیش از آستانه → عدم انتشار آن داده + دلیل در status KV.
# غایب = پیش‌فرض (آستانه‌ها بر اساس نوسان طبیعی گروه بازار: ارز/طلا/تتر).
CROSS_CHECK_ENABLED = "true"
CROSS_CHECK_FX_TOLERANCE_PCT = "2.5"
CROSS_CHECK_GOLD_TOLERANCE_PCT = "5"
CROSS_CHECK_TETHER_TOLERANCE_PCT = "3"

# Cron Triggers:
#   "*/5 * * * *"  → هر ۵ دقیقه: دلار+تتر (فقط در ساعت باز بازار fetch میکند؛
#                    CLOSED → کش + نشان بسته؛ داده بی‌تغییر = بدون تماس تلگرام)
#   "0 */6 * * *"  → هر ۶ ساعت: گزارش کامل بازار (ارزها/طلا/سکه‌ها — sendMessage)
# سقف پلتفرم: ۵ trigger per account (پلن رایگان) — فقط ۲ استفاده میشود.
[triggers]
crons = ["*/5 * * * *", "0 */6 * * *"]

# KV برای وضعیت ربات (message_id پیام ثابت، فلگ pause، آخرین قیمت‌ها، وضعیت اجرا)
# round 15: namespace تازه 6d13a5b3… (سالم و بدون state قدیمی).
# نکتهٔ ابزار: خواندن/نوشتن KV با wrangler بهصورت پیشفرض LOCAL است — برای دیدن
# state واقعی production حتماً --remote بدهید (در تشخیص این مرحله باگ ابزار بود،
# نه خرابی binding). دادهٔ واقعی کاربر (تیکت #۱) به این namespace منتقل شد.
[[kv_namespaces]]
binding = "STATE"
id = "6d13a5b30bd049de899edd602f3e3699"

[observability]
enabled = true
